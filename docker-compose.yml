services:
  postgres:
    image: postgres:16-alpine
    container_name: simfinity-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: simfinity
      POSTGRES_USER: simfinity
      POSTGRES_PASSWORD: simfinity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: simfinity-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@simfinity.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    container_name: simfinity-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simfinity-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: simfinity
      DB_USER: simfinity
      DB_PASSWORD: simfinity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Set your real API keys here or in a .env file
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      ZENDIT_API_KEY: ${ZENDIT_API_KEY:-}
      OPENCELLID_API_KEY: ${OPENCELLID_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      APP_WEB_URL: ${APP_WEB_URL:-http://localhost:8090}
    volumes:
      - avatars_data:/app/avatars
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  avatars_data:
  redis_data:
