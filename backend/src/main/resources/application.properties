server.port=${PORT:3000}
server.address=0.0.0.0
spring.application.name=simfinity-backend

# API Keys — set these in environment variables or in a local .env equivalent
# INSIGHT_API_KEY, PAYSTACK_SECRET_KEY, ZENDIT_API_KEY
insight.api.key=${GEMINI_API_KEY:}
paystack.secret.key=${PAYSTACK_SECRET_KEY:}
zendit.api.key=${ZENDIT_API_KEY:sand_39f37bfb-25f7-4de4-9564-024003cde0d46a2b28a84063e9f8a9c79227}

# Allow cross-origin requests from the mobile app / local web client
spring.web.cors.allowed-origins=*

# Redis — shared cache (Zendit offers, coverage data, exchange rates) so multiple
# backend instances stay consistent and don't each hammer external APIs separately.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:simfinity}
spring.datasource.username=${DB_USER:simfinity}
spring.datasource.password=${DB_PASSWORD:simfinity}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:simfinity-jwt-secret-key-min-256-bits-change-in-production-2024}
jwt.expiration.hours=168

# OpenCellID — network coverage heatmap
opencellid.api.key=${OPENCELLID_API_KEY:}

# Exchange rates (base: GHS)
exchangerate.api.key=${EXCHANGERATE_API_KEY:216a42aaeb82152fe649c421}

# Avatar image storage (mounted as a Docker volume)
app.avatar-dir=${AVATAR_DIR:/app/avatars}

# Brevo transactional email API
brevo.api.key=${BREVO_API_KEY:}

# Public base URL used in email links (set to real URL in production)
app.base-url=${APP_BASE_URL:http://localhost:3000}

# Public URL of the web app build — used for links that should work without the
# native app installed (e.g. password reset), since simfinity:// deep links only
# work from a device that already has the app, and desktop email clients can't
# open them at all.
app.web-url=${APP_WEB_URL:http://localhost:8090}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
